<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <div class="card-set">

            <img src="zhezhi.jpg" alt="profile">
            <br>

            <h2 id="name"> Kaedee </h2>

            <p id="major-output"> BS Information Technology </p>

            <input type="text" id="nname" placeholder="Enter your nickname">

            <br>

            <select id="major">
                <option value="">Select Year</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Computer Science</option>
                <option value="BSECE">BS Electronics and Communications Engineering</option>
                <option value="BSEE">BS Electrical Engineering</option>
            </select>

            <br><br>

            <button id="btn1">Click</button>
            <button id="btn2">Double Click</button>
            <button id="btn3">Press & Hold</button>
            
            <br><br>

            <p id="output">Waiting for interaction...</p>

        </div>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
