<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <link rel="stylesheet" href="Registration.css">

</head>
<body>

    <header>

        <h1>My Personal Website</h1>
        <h3>Welcome to my Personal Student Portal</h3>

    </header>

    <nav>

        <a href="Home.html" target="_self">Home</a>
        <a href="Registration.html" target="_self">Registration</a>
        <a href="Grades.html" target="_self">Grades</a>
        <a href="Profile.html" target="_self">Profile</a>

    </nav>
    
    <div class="container">

        <form>

            <h3>Student Registration Form</h3>
            <br>
            <br>

            <label>Student Name:</label>
            <br>
            <input type="text" placeholder="Enter Name" class="inp">

            <br>
            <br>

            <label>Email:</label>
            <br>
            <input type="email" placeholder="Enter Email" class="inp">

            <br>
            <br>

            <label>Password:</label>
            <br>
            <input type="password" placeholder="Enter Password" class="inp">

            <br>
            <br>

            <label>Gender:</label>
            <br>
            <input type="radio">Male
            <input type="radio">Female

            <br>
            <br>

            <label>Course:</label>
            <br>
            <select name="dropdown" placeholder="Select courses" class="inp">
                <option value="BSIT">BSIT</option>
                <option value="BSCS">BSCS</option>
                <option value="BSOAD">BSOAD</option>
            </select>

            <br>
            <br>

            <label>Skills:</label>
            <br>
            <input type="checkbox">HTML
            <input type="checkbox">CSS
            <input type="checkbox">JavaScript

            <br>
            <br>

            <label>Profile Pricture</label>
            <br>
            <input type="file" name="fileupload" accept="image/*"/>

            <br>
            <br>

            <label>Address:</label>
            <br>
            Description: <br/>
            <textarea rows="5" cols="50" name="Description" placeholder="Enter address here..." class="inp"></textarea>

            <br>
            <br>

            <button type="submit" class="btn">Login</button>
            <br>
            <button type="reset" class="btn">Cancel</button>

        </form>

    </div>

    <footer>
        <h3>2026 My Personal Website</h3>
    </footer>

</body>
</html>
